# Deny direct web access to internal project directories.
<DirectoryMatch "^/var/www/html/(config|database|includes|vendor)(/|$)">
    Require all denied
</DirectoryMatch>

# Deny direct access to project and deployment configuration files.
<FilesMatch "^(\.env.*|\.gitignore|Dockerfile|docker-compose.*|composer\.(json|lock)|render-vhost\.conf)$">
    Require all denied
</FilesMatch>

# Do not allow Apache to serve directory listings.
<Directory /var/www/html>
    Options -Indexes
</Directory>
